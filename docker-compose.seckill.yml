services:
  # First run one normal k6 test to perform the stock preflight and Redis preload.
  # The three runners below deliberately skip preload: resetting Redis after another
  # runner has begun reserving stock would invalidate the consistency test.
  k6-runner-1:
    image: grafana/k6:0.54.0
    profiles: ["distributed-seckill"]
    networks: [seckill_default]
    environment:
      BASE_URL: http://gateway-service:8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the calling shell}
      SECKILL_PROFILE: throughput
      SKIP_PRELOAD: "true"
      K6_RUN_ID: distributed-1
      MINIMUM_ACCEPTED_ORDERS: "0"
      K6_SUMMARY_FILE: seckill-runner-1-summary.md
    volumes:
      - ./tests/k6:/scripts:ro
      - ./reports:/reports
    command: ["run", "--execution-segment", "0:1/3", "--execution-segment-sequence", "0,1/3,2/3,1", "--out", "json=/reports/seckill-runner-1.json", "/scripts/seckill.js"]

  k6-runner-2:
    image: grafana/k6:0.54.0
    profiles: ["distributed-seckill"]
    networks: [seckill_default]
    environment:
      BASE_URL: http://gateway-service:8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the calling shell}
      SECKILL_PROFILE: throughput
      SKIP_PRELOAD: "true"
      K6_RUN_ID: distributed-2
      MINIMUM_ACCEPTED_ORDERS: "0"
      K6_SUMMARY_FILE: seckill-runner-2-summary.md
    volumes:
      - ./tests/k6:/scripts:ro
      - ./reports:/reports
    command: ["run", "--execution-segment", "1/3:2/3", "--execution-segment-sequence", "0,1/3,2/3,1", "--out", "json=/reports/seckill-runner-2.json", "/scripts/seckill.js"]

  k6-runner-3:
    image: grafana/k6:0.54.0
    profiles: ["distributed-seckill"]
    networks: [seckill_default]
    environment:
      BASE_URL: http://gateway-service:8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the calling shell}
      SECKILL_PROFILE: throughput
      SKIP_PRELOAD: "true"
      K6_RUN_ID: distributed-3
      MINIMUM_ACCEPTED_ORDERS: "0"
      K6_SUMMARY_FILE: seckill-runner-3-summary.md
    volumes:
      - ./tests/k6:/scripts:ro
      - ./reports:/reports
    command: ["run", "--execution-segment", "2/3:1", "--execution-segment-sequence", "0,1/3,2/3,1", "--out", "json=/reports/seckill-runner-3.json", "/scripts/seckill.js"]

networks:
  seckill_default:
    external: true
    name: sekill_default
